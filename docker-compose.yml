services:
  # =========================================================================
  # PostgreSQL Database Service
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medusa_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medusa_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medusa-network

  # =========================================================================
  # Redis / Valkey Cache & Event Bus Service
  # =========================================================================
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - medusa-network

  # =========================================================================
  # Meilisearch Engine (Rust-based Ultra-fast Typo-tolerant Search Engine)
  # =========================================================================
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=majalahpdf_meilisearch_master_key_2026_ultra_secure
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - medusa-network

  # =========================================================================
  # Rust Dynamic Image Resizer & Optimizer API (Axum + SIMD WebP Engine)
  # =========================================================================
  image-optimizer:
    build:
      context: ./image-optimizer
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      RUST_LOG: info
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - medusa-network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.image-optimizer.rule=Host(`majalahpdf.my.id`) && PathPrefix(`/fit`)"
      - "traefik.http.routers.image-optimizer.entrypoints=web,websecure"
      - "traefik.http.services.image-optimizer.loadbalancer.server.port=3001"

  # =========================================================================
  # Rust Bulk PDF Uploader & Cover Extractor (Axum Engine)
  # =========================================================================
  rust-uploader:
    build:
      context: ./rust-uploader
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      RUST_LOG: info
      AUTH_USER: ${UPLOAD_AUTH_USER:-admin}
      AUTH_PASS: ${UPLOAD_AUTH_PASS:-MajalahPdfAdmin2026!}
      AUTH_SECRET: ${UPLOAD_AUTH_SECRET:-rust_uploader_digitalpitstop_secret_token_2026}
      S3_ENDPOINT: https://s3api2.skyconnection.id
      S3_BUCKET: image
      S3_REGION: ap-southeast-3
      S3_ACCESS_KEY: XqrFYxNFGTbdH5twUGIm
      S3_SECRET_KEY: mzx149zjcUUTxhNseluIkEMe5MVoL6j0AEju7anS
      GDRIVE_ROOT_FOLDER_NAME: "PDF ALL"
      GDRIVE_CREDENTIALS_JSON: ${GDRIVE_CREDENTIALS_JSON:-}
      GDRIVE_CREDENTIALS_FILE: /app/service-account.json
      GDRIVE_OAUTH_FILE: /app/data/gdrive_oauth.json
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-573754266292-b02va05mmls6idmu8om3gflvvio6f7t1.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://rustupload.majalahpdf.my.id/api/auth/gdrive/callback
    volumes:
      - ./storefront/service-account.json:/app/service-account.json:ro
      - rust_uploader_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - medusa-network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.rust-uploader.rule=Host(`rustupload.majalahpdf.my.id`)"
      - "traefik.http.routers.rust-uploader.entrypoints=web,websecure"
      - "traefik.http.services.rust-uploader.loadbalancer.server.port=3002"

  # =========================================================================
  # Medusa v2 Backend & Admin Dashboard
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/medusa_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-supersecret_jwt_key_medusa_ecommerce_2026}
      COOKIE_SECRET: ${COOKIE_SECRET:-supersecret_cookie_key_medusa_ecommerce_2026}
      STORE_CORS: ${STORE_CORS:-https://majalahpdf.my.id,https://www.majalahpdf.my.id,http://localhost:8000,http://localhost:3000}
      ADMIN_CORS: ${ADMIN_CORS:-https://api.majalahpdf.my.id,http://localhost:7000,http://localhost:7001,http://localhost:9000}
      AUTH_CORS: ${AUTH_CORS:-https://majalahpdf.my.id,https://www.majalahpdf.my.id,https://api.majalahpdf.my.id,http://localhost:7000,http://localhost:8000,http://localhost:9000}
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:-admin@majalahpdf.my.id}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:-MajalahPdfAdmin2026!}
      SEED_DB: ${SEED_DB:-true}
      DISABLE_MEDUSA_ADMIN: "true"
      MEDUSA_TELEMETRY_DISABLED: "1"
      S3_BUCKET: ${S3_BUCKET:-medusa}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - medusa-network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.backend.rule=Host(`api.majalahpdf.my.id`)"
      - "traefik.http.routers.backend.entrypoints=web,websecure"
      - "traefik.http.services.backend.loadbalancer.server.port=9000"

  # =========================================================================
  # Customer-Facing Next.js Storefront
  # =========================================================================
  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-https://api.majalahpdf.my.id}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://majalahpdf.my.id}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-id}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_medusa_default_key}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-https://api.majalahpdf.my.id}
      MEDUSA_BACKEND_URL: http://backend:9000
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://majalahpdf.my.id}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-id}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_medusa_default_key}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-medusa}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:-admin@majalahpdf.my.id}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:-MajalahPdfAdmin2026!}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: majalahpdf_meilisearch_master_key_2026_ultra_secure
      IMAGE_OPTIMIZER_URL: http://image-optimizer:3001
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-notreseller.magazine@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-}
      GDRIVE_CREDENTIALS_JSON: ${GDRIVE_CREDENTIALS_JSON:-}
    depends_on:
      - backend
      - meilisearch
      - image-optimizer
    volumes:
      - storefront_data:/app/data
      - storefront_uploads:/app/public/uploads
    networks:
      - medusa-network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.storefront.rule=Host(`majalahpdf.my.id`) || Host(`www.majalahpdf.my.id`)"
      - "traefik.http.routers.storefront.entrypoints=web,websecure"
      - "traefik.http.services.storefront.loadbalancer.server.port=8000"

volumes:
  rust_uploader_data:
    driver: local
  postgres_data:
    driver: local
  valkey_data:
    driver: local
  redis_data:
    driver: local
  storefront_data:
    driver: local
  storefront_uploads:
    driver: local
  meilisearch_data:
    driver: local

networks:
  medusa-network:
    driver: bridge
  dokploy-network:
    external: true
